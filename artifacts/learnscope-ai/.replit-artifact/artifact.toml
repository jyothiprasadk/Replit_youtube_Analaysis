kind = "web"
previewPath = "/"
title = "LearnScope AI"
description = "An AI-powered learning coverage analyzer that compares YouTube learning sources against a student's target syllabus, explains evidence, highlights gaps, and recommends the best way to learn."
version = "1.0.0"
id = "artifacts/learnscope-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21792

[services.development]
run = "pnpm --filter @workspace/learnscope-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/learnscope-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/learnscope-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21792"
BASE_PATH = "/"
